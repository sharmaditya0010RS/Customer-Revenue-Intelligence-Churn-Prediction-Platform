services:
  - type: web
    name: customer-intelligence-web
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: >-
      streamlit run app/streamlit_app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true

    envVars:
      - key: APP_ENV
        value: cloud

      - key: PYTHON_VERSION
        value: 3.11.4

      - key: DATABASE_URL
        fromDatabase:
          name: customer-intelligence-db
          property: connectionString

  - type: worker
    name: customer-intelligence-generator
    runtime: python
    plan: starter

    buildCommand: pip install -r requirements.txt

    startCommand: python -m src.generator_worker

    envVars:
      - key: APP_ENV
        value: cloud

      - key: GENERATOR_WORKER_MODE
        value: cloud

      - key: PYTHON_VERSION
        value: 3.11.4

      - key: DATABASE_URL
        fromDatabase:
          name: customer-intelligence-db
          property: connectionString

databases:
  - name: customer-intelligence-db
    plan: basic-256mb
    databaseName: customer_intelligence
    user: customer_intelligence